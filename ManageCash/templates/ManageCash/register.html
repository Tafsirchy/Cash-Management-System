{% extends 'ManageCash/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white border border-slate-100 shadow-sm rounded-2xl p-6 sm:p-8 mt-8">
  <div class="flex flex-col items-center justify-center mb-6 text-center">
    <span class="p-3 bg-teal-50 text-teal-600 rounded-2xl mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
    </span>
    <h2 class="text-xl font-bold tracking-tight text-slate-900">Create an Account</h2>
    <p class="text-slate-500 text-sm mt-1">Start tracking your income and expenses today</p>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
      <input type="text" name="username" id="username" placeholder="Choose a username" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
    </div>
    
    <div>
      <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Email Address</label>
      <input type="email" name="email" id="email" placeholder="you@example.com" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm">
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
        <input type="password" name="password" id="password" placeholder="Create a password" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
      </div>
      
      <div>
        <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat your password" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
      </div>
    </div>
    
    <div class="pt-2">
      <button class="w-full px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-sm shadow-teal-100 hover:shadow-md transition-all duration-200" type="submit">Sign Up</button>
    </div>
  </form>
</div>
{% endblock %}
