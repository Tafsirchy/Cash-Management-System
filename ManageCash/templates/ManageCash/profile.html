{% extends 'ManageCash/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white border border-slate-100 shadow-sm rounded-2xl p-6 sm:p-8">
  <!-- Simplistic Profile Header with Typographic Avatar -->
  <div class="flex items-center gap-4 mb-6 pb-6 border-b border-slate-100">
    <div class="w-14 h-14 rounded-full bg-teal-50 border border-teal-100 flex items-center justify-center text-teal-600 text-xl font-bold uppercase shrink-0">
      {{ user.username|slice:":1" }}
    </div>
    <div>
      <h2 class="text-lg font-bold tracking-tight text-slate-900">Profile Settings</h2>
      <p class="text-xs text-slate-500">Update your account credentials and contact email.</p>
    </div>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
      <input type="text" name="username" id="username" value="{{ user.username }}" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
    </div>
    
    <div>
      <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
      <input type="email" name="email" id="email" value="{{ user.email }}" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm">
    </div>
    
    <div class="flex items-center justify-end gap-2 pt-4 border-t border-slate-100">
      <a class="px-5 py-2.5 bg-white border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-50 text-sm font-semibold rounded-xl transition-all duration-200" href="{% url 'dashboard' %}">Cancel</a>
      <button class="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-sm shadow-teal-100 hover:shadow-md transition-all duration-200" type="submit">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
