{% extends 'ManageCash/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-100 shadow-sm rounded-2xl p-6 sm:p-8 mt-8">
  <div class="flex flex-col items-center justify-center mb-6 text-center">
    <span class="p-3 bg-teal-50 text-teal-600 rounded-2xl mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
    </span>
    <h2 class="text-xl font-bold tracking-tight text-slate-900">Welcome Back</h2>
    <p class="text-slate-500 text-sm mt-1">Please sign in to manage your cash flow</p>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Username or Email</label>
      <input type="text" name="username" id="username" placeholder="Enter your username or email" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
    </div>
    
    <div>
      <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
      <input type="password" name="password" id="password" placeholder="••••••••" class="block w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all duration-200 text-sm" required>
    </div>
    
    <div class="pt-2">
      <button class="w-full px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold rounded-xl shadow-sm shadow-teal-100 hover:shadow-md transition-all duration-200" type="submit">Sign In</button>
    </div>

    <p class="text-center text-sm text-slate-500 pt-1">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-teal-600 hover:text-teal-700 font-semibold transition-colors duration-200">Register</a>
    </p>
  </form>
</div>
{% endblock %}
